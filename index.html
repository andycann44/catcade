577}.paw{position:absolute;z-index:5;top:62%;width:27%;height:24%;border-radius:50%;background:linear-gradient(145deg,var(--fur),var(--fur2));box-shadow:inset -3px -3px 5px #0002}.paw.l{left:5%;transform:rotate(12deg)}.paw.r{right:5%;transform:rotate(-12deg)}.paw:after{content:"•••";position:absolute;inset:29% 0 auto;text-align:center;font-size:8px;letter-spacing:1px;color:#b65f70}.tail{position:absolute;z-index:1;right:2%;bottom:10%;width:22%;height:43%;border:11px solid var(--fur2);border-left:0;border-bottom:0;border-radius:0 80% 0 0;transform:rotate(18deg)}.badge{position:absolute;z-index:8;top:3%;left:50%;transform:translateX(-50%);font-size:19px;text-shadow:0 2px #0005}.sleep .eye{height:2px;aspect-ratio:auto;top:39%;border-radius:0;box-shadow:none}.sleep .mouth{transform:rotate(180deg);top:67%}.sleep .badge:after{content:"💤"}.goldcat{--fur:#ffd856!important;--fur2:#e79f18!important}.goldcat .badge:after{content:"★";color:#fff4a4}.dangercat{--fur:#45435d!important;--fur2:#29283b!important}.dangercat .badge:after{content:"⚠️"}.dangercat .muzzle{background:#f0e9ff}.dangercat .eye{background:#a31645;box-shadow:inset 2px 2px #fff,0 0 5px #ff4b77}.cat[data-style="1"]{--fur:#bbb9bd;--fur2:#858188}.cat[data-style="2"]{--fur:#f18c6e;--fur2:#c85e47}.cat[data-style="3"]{--fur:#ad8ad9;--fur2:#805eb6}.cat[data-style="4"]{--fur:#f3e2c6;--fur2:#cab69b}.cat[data-style="5"]{--fur:#766b67;--fur2:#4f4745}.cat[data-style="6"]{--fur:#e7a0ba;--fur2:#b86f8d}.banner{height:calc(52px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;color:#6a6770;display:flex;align-items:center;justify-content:center;font-size:9px;letter-spacing:1.2px;border-top:1px solid #ddd}.overlay{position:absolute;inset:0;z-index:20;background:radial-gradient(circle at 50% 18%,#6f3bc7dd,#1b0c3cf4 62%,#0c071bea);display:flex;align-items:center;justify-content:center;padding:12px}.hidden{display:none}.card{width:min(94%,430px);max-height:calc(100% - 18px);overflow:auto;text-align:center;background:linear-gradient(155deg,#7d43da,#331472);border:2px solid #c6a7ff66;border-radius:28px;padding:15px 14px 17px;box-shadow:0 18px 50px #000a,inset 0 1px #fff5}.card:before{content:"";display:block;width:68px;height:5px;margin:0 auto 8px;border-radius:8px;background:#ffffff55}.card h1{font-size:37px;line-height:1;margin:2px 0;color:#ffe04b;text-shadow:0 4px #e640a2}.card h2{font-size:20px;margin:7px 0 3px}.card p{margin:4px 0 9px;color:#eadfff}.btn{border:0;border-radius:999px;background:linear-gradient(#ffe45a,#ffb715);padding:13px 28px;font-size:18px;font-weight:1000;color:#5c217c;box-shadow:0 5px #cf7813,0 8px 15px #0005;min-width:180px}.btn:active{transform:translateY(3px);box-shadow:0 2px #cf7813}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}.lv{height:52px;border:0;border-radius:12px;background:#ffffff12;color:#fff;font-weight:1000;border:1px solid #ffffff20;box-shadow:inset 0 1px #fff1}.lv.open{background:linear-gradient(#ff65b3,#7c3ad2)}.lv.current{outline:2px solid #ffe04b}.lv small{display:block;font-size:7px;margin-top:1px;opacity:.9;white-space:nowrap;overflow:hidden}.tip{font-size:11px!important;opacity:.9}.stars{font-size:29px}.progress{height:7px;background:#ffffff20;border-radius:9px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#55ddff,#ffe14a)}.toast{position:absolute;z-index:18;top:12%;left:50%;transform:translateX(-50%);font-size:25px;font-weight:1000;color:#ffe84c;text-shadow:0 3px #9b236f,0 5px 10px #0009;animation:toast .65s forwards;pointer-events:none}@keyframes toast{to{transform:translate(-50%,-48px) scale(1.25);opacity:0}}.shake{animation:shake .2s}@keyframes shake{50%{transform:translateX(6px)}}@media(max-height:720px){.top{padding-top:max(4px,env(safe-area-inset-top))}.brand{font-size:24px}.stats{font-size:12px}.board{inset:30px 8px 6px;gap:7px}.card{padding:10px}.lv{height:43px}.card h1{font-size:31px}.card h2{font-size:17px}.card p{font-size:12px}.btn{padding:10px 24px}.banner{height:calc(45px + env(safe-area-inset-bottom))}}</style></head><body><div class="app"><header class="top"><div class="brand">CATCADE</div><div class="levelname" id="levelName">CARNIVAL ARCADE</div><div class="stats"><span class="stat">⭐ <b id="score">0</b></span><span class="stat">🔥 <b id="combo">0</b>x</span><span class="stat">❤️ <b id="lives">3</b></span><span class="stat">⏱️ <b id="time">--</b></span></div></header><main class="stage" id="stage"><div class="board" id="board"></div><div class="overlay" id="overlay"><div class="card" id="card"></div></div></main><div class="banner">ADVERTISEMENT · BANNER RESERVED</div></div><script>const LEVELS=[{name:'Meadow Pop',desc:'Classic warm-up',theme:'meadow',mode:'normal',time:18,speed:900},{name:'Daisy Dash',desc:'Faster pops',theme:'meadow',mode:'normal',time:20,speed:760},{name:'Sleepy Hollow',desc:"Don't hit the warning cat",theme:'night',mode:'avoid',time:22,speed:800},{name:'Golden Paws',desc:'Gold cats score triple',theme:'sunset',mode:'gold',time:22,speed:720},{name:'Double Trouble',desc:'Two cats — one stays longer',theme:'circus',mode:'double',time:24,speed:760},{name:'Moonlight Mischief',desc:'Targets and danger cats',theme:'night',mode:'avoid',time:24,speed:650},{name:'Candy Cats',desc:'Combo challenge',theme:'candy',mode:'normal',time:25,speed:620},{name:'Pirate Pounce',desc:'Treasure cats',theme:'pirate',mode:'gold',time:25,speed:600},{name:'Spooky Paws',desc:'Avoid warning cats',theme:'spooky',mode:'avoid',time:26,speed:590},{name:'Snowball Pop',desc:'Icy speed',theme:'snow',mode:'normal',time:26,speed:560},{name:'Neon Kitty',desc:'Two targets with staggered timing',theme:'neon',mode:'double',time:27,speed:590},{name:'Royal Rumble',desc:'Crowns score triple',theme:'royal',mode:'gold',time:27,speed:540},{name:'Jungle Jumps',desc:'Wild staggered doubles',theme:'jungle',mode:'double',time:28,speed:560},{name:'Space Cats',desc:'Zero-gravity speed',theme:'space',mode:'normal',time:28,speed:500},{name:'Rainbow Rush',desc:'Keep the streak',theme:'rainbow',mode:'normal',time:29,speed:470},{name:'Midnight Mayhem',desc:'Danger cats cost a life',theme:'night',mode:'avoid',time:29,speed:480},{name:'Carnival Chaos',desc:'Fast staggered doubles',theme:'circus',mode:'double',time:30,speed:500},{name:'Golden Frenzy',desc:'Jackpot round',theme:'gold',mode:'gold',time:30,speed:440},{name:'Catcade Blitz',desc:'Fast doubles and danger cats',theme:'neon',mode:'doubleDanger',time:30,speed:420},{name:'Grand Finale',desc:'Everything at once',theme:'final',mode:'mixed',time:35,speed:390}];let level=+(localStorage.catcadeLevel||0),unlocked=Math.max(0,+(localStorage.catcadeUnlocked||0)),score=0,combo=0,bestCombo=0,lives=3,time=0,running=false,timers=[],active=new Set(),types={};const $=s=>document.querySelector(s),board=$('#board'),stage=$('#stage'),overlay=$('#overlay'),card=$('#card'),scoreEl=$('#score'),comboEl=$('#combo'),livesEl=$('#lives'),timeEl=$('#time');function catHTML(i){return `<div class="cat" data-i="${i}" data-style="${i%7}"><i class="tail"></i><i class="plushBody"><i class="belly"></i></i><i class="plushHead"><i class="ear l"></i><i class="ear r"></i><i class="eye l"></i><i class="eye r"></i><i class="muzzle"></i><i class="nose"></i><i class="mouth"></i><i class="whisker l"></i><i class="whisker r"></i></i><i class="paw l"></i><i class="paw r"></i><b class="badge"></b></div>`}for(let i=0;i<9;i++){const h=document.createElement('div');h.className='hole';h.innerHTML=catHTML(i);h.addEventListener('pointerdown',()=>hit(i));board.append(h)}const cats=[...document.querySelectorAll('.cat')];function menu(){running=false;clearAll();const buttons=LEVELS.map((x,i)=>`<button class="lv ${i<=unlocked?'open':''} ${i===level?'current':''}" ${i>unlocked?'disabled':''} onclick="pick(${i})">${i+1}<small>${i>unlocked?'🔒':x.name.split(' ')[0]}</small></button>`).join('');card.innerHTML=`<h1>CATCADE</h1><h2>20 LEVEL CARNIVAL</h2><p>Soft paws. Fast reactions. Big scores.</p><div class="levels">${buttons}</div><button class="btn" onclick="start()">PLAY LEVEL ${level+1}</button><p class="tip">${LEVELS[level].name} · ${LEVELS[level].desc}</p>`;overlay.classList.remove('hidden')}function pick(i){if(i<=unlocked){level=i;localStorage.catcadeLevel=i;menu()}}function clearAll(){timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[];active.clear();cats.forEach(c=>c.className='cat')}function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t}function start(){clearAll();const L=LEVELS[level];score=0;combo=0;bestCombo=0;lives=3;time=L.time;running=true;scoreEl.textContent=0;comboEl.textContent=0;livesEl.textContent=3;timeEl.textContent=time;$('#levelName').textContent=`LEVEL ${level+1} · ${L.name.toUpperCase()}`;stage.dataset.theme=L.theme;overlay.classList.add('hidden');spawn();const clock=setInterval(()=>{if(!running){clearInterval(clock);return}time--;timeEl.textContent=time;if(time<=0)finish(true)},1000);timers.push(clock)}function spawn(){if(!running)return;const L=LEVELS[level],doubleMode=['double','doubleDanger','mixed'].includes(L.mode),count=doubleMode?2:1;for(let k=0;k<count;k++){const choices=[0,1,2,3,4,5,6,7,8].filter(x=>!active.has(x));if(!choices.length)break;const i=choices[Math.floor(Math.random()*choices.length)],r=Math.random();let type='normal';if(['avoid','doubleDanger','mixed'].includes(L.mode)&&r<.25)type='danger';else if(['gold','mixed'].includes(L.mode)&&r<.34)type='gold';const stay=L.speed*(doubleMode?(k===0?1.5:1.05):1);show(i,type,stay)}later(spawn,Math.max(250,L.speed*(doubleMode?.9:1)))}function show(i,type,speed){const c=cats[i];active.add(i);types[i]=type;c.className=`cat ${type==='danger'?'dangercat ':type==='gold'?'goldcat ':''}up`;c.dataset.style=i%7;later(()=>{if(active.has(i)){c.classList.remove('up');active.delete(i);if(type==='normal'||type==='gold')miss()}},speed)}function miss(){combo=0;comboEl.textContent=0}function hit(i){if(!running||!active.has(i))return;const type=types[i],c=cats[i];active.delete(i);c.classList.add('hit');c.classList.remove('up');if(type==='danger'){lives--;combo=0;livesEl.textContent=lives;comboEl.textContent=0;stage.classList.add('shake');later(()=>stage.classList.remove('shake'),220);toast('OUCH! -1 LIFE');if(navigator.vibrate)navigator.vibrate([50,40,80]);if(lives<=0)finish(false);return}combo++;bestCombo=Math.max(bestCombo,combo);const pts=(10+Math.min(combo,15)*2)*(type==='gold'?3:1);score+=pts;scoreEl.textContent=score;comboEl.textContent=combo;toast(type==='gold'?`JACKPOT +${pts}`:`+${pts}`)}function toast(text){const x=document.createElement('div');x.className='toast';x.textContent=text;stage.append(x);later(()=>x.remove(),700);if(navigator.vibrate)navigator.vibrate(18)}function finish(completed){if(!running)return;running=false;clearAll();const stars=score>520?3:score>280?2:1;if(completed&&level===unlocked&&unlocked<19){unlocked++;localStorage.catcadeUnlocked=unlocked}localStorage.catcadeBest=Math.max(+(localStorage.catcadeBest||0),score);card.innerHTML=`<h1>${completed?'LEVEL CLEAR!':'OUT OF LIVES'}</h1><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><h2>${score} POINTS</h2><p>Best combo ×${bestCombo} · Level ${level+1} of 20</p><div class="progress"><i style="width:${Math.min(100,score/6)}%"></i></div>${completed&&level<19?`<button class="btn" onclick="next()">NEXT LEVEL</button>`:`<button class="btn" onclick="start()">PLAY AGAIN</button>`}<p class="tip" onclick="menu()">← Level Select</p>`;overlay.classList.remove('hidden')}function next(){level=Math.min(19,level+1);localStorage.catcadeLevel=level;start()}menu();</script></body></html>
