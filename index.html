<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#27105e"><title>Catcade</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}:root{--gold:#ffd43b}body{margin:0;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui;background:#160a36;color:#fff;overflow:hidden}button{font:inherit}.app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 0,#5e2bb9,#28105e 42%,#100a29)}.top{padding:max(8px,env(safe-area-inset-top)) 12px 5px;text-align:center;z-index:3;background:#230d59dd;backdrop-filter:blur(8px);box-shadow:0 5px 18px #0005}.brand{font-size:29px;font-weight:1000;color:var(--gold);text-shadow:0 3px #d637a3}.levelname{font-size:11px;font-weight:900;letter-spacing:1.2px;color:#d7c7ff}.stats{display:flex;justify-content:space-around;font-size:14px;font-weight:900;margin-top:4px}.stage{flex:1;position:relative;min-height:0;overflow:hidden;background:linear-gradient(#7544c5 0 30%,#4d9e53 31%)}.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 16%,#fff 0 2px,transparent 3px),radial-gradient(circle at 78% 11%,#ffd858 0 3px,transparent 4px);background-size:80px 70px;opacity:.65}.stage[data-theme="night"],.stage[data-theme="space"],.stage[data-theme="spooky"]{background:linear-gradient(#14133d,#30236b 40%,#18394a)}.stage[data-theme="snow"]{background:linear-gradient(#7fdcff,#dffaff 40%,#9bd2dc)}.stage[data-theme="candy"],.stage[data-theme="rainbow"]{background:linear-gradient(#ff8ec8,#8153c8 45%,#63c77d)}.stage[data-theme="neon"],.stage[data-theme="final"]{background:linear-gradient(#120a32,#34125b 42%,#172040)}.stage[data-theme="sunset"],.stage[data-theme="gold"],.stage[data-theme="royal"],.stage[data-theme="pirate"]{background:linear-gradient(#ff825f,#77369b 42%,#3c714d)}.stage[data-theme="jungle"]{background:linear-gradient(#2c8d79,#1d5139 42%,#234126)}.stage[data-theme="circus"]{background:repeating-linear-gradient(110deg,#6d1f79 0 50px,#a82762 50px 100px)}.board{position:absolute;inset:8px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;max-width:520px;margin:auto}.hole{position:relative;overflow:hidden;border-radius:42% 42% 25% 25%;background:radial-gradient(ellipse at 50% 68%,#05030c 0 34%,#6c3a27 36% 45%,#3b8a39 47% 65%,#27722c 70%);box-shadow:inset 0 -10px 18px #0006,0 4px 6px #0004}.cat{position:absolute;left:14%;width:72%;height:78%;bottom:-83%;transition:bottom .16s cubic-bezier(.1,1.3,.3,1),transform .12s;filter:drop-shadow(0 7px 5px #0005)}.cat.up{bottom:6%}.cat.hit{transform:scale(.72) rotate(13deg)}.ear{position:absolute;top:3%;width:35%;height:35%;background:var(--fur);border-radius:10% 90% 25% 65%;transform:rotate(35deg)}.ear.r{right:0;transform:scaleX(-1) rotate(35deg)}.ear.l{left:0}.body{position:absolute;inset:16% 0 0;border-radius:48% 48% 40% 40%;background:var(--fur);box-shadow:inset -10px -12px #00000010}.face{position:absolute;z-index:2;top:33%;left:16%;width:68%;height:36%;background:#fff7e4;border-radius:48%}.eye{position:absolute;top:28%;width:12%;aspect-ratio:1;background:#181322;border-radius:50%;box-shadow:inset 2px 2px #fff}.eye.l{left:21%}.eye.r{right:21%}.nose{position:absolute;left:44%;top:50%;width:12%;height:10%;background:#e46c7f;border-radius:60% 60% 80% 80%}.mouth{position:absolute;top:59%;left:38%;width:24%;height:17%;border-bottom:2px solid #5d3442;border-radius:50%}.belly{position:absolute;left:27%;bottom:6%;width:46%;height:32%;background:#fff5dd88;border-radius:50%}.badge{position:absolute;z-index:4;top:7%;left:35%;font-size:20px}.sleep .eye{height:2px;top:35%;border-radius:0;box-shadow:none}.sleep:after{content:"Zzz";position:absolute;z-index:5;right:-5px;top:16%;font-weight:1000;color:#bcecff}.goldcat{--fur:#ffd43b!important}.goldcat .badge:after{content:"★"}.banner{height:calc(52px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;color:#6b6b73;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:1px}.overlay{position:absolute;inset:0;z-index:10;background:linear-gradient(#2a1264f4,#100923fa);display:flex;align-items:center;justify-content:center;padding:16px}.hidden{display:none}.card{width:min(94%,430px);max-height:96%;overflow:auto;text-align:center;background:linear-gradient(155deg,#713bd0,#2b1268);border:3px solid #ffffff38;border-radius:28px;padding:18px;box-shadow:0 16px 50px #0008,inset 0 0 25px #fff1}.card h1{font-size:40px;margin:0;color:var(--gold);text-shadow:0 4px #d42f9e}.card h2{margin:5px 0}.card p{color:#e7ddff;margin:7px 0 14px}.btn{border:0;border-radius:999px;background:linear-gradient(#ffe34f,#ffb914);padding:14px 30px;font-size:19px;font-weight:1000;color:#5b2178;box-shadow:0 6px #d77c12;min-width:180px}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.lv{aspect-ratio:1;border:0;border-radius:14px;background:#ffffff18;color:#fff;font-weight:900;border:1px solid #ffffff24}.lv.open{background:linear-gradient(#ff67b4,#8338d7)}.lv.current{outline:3px solid var(--gold)}.lv small{display:block;font-size:8px;opacity:.8}.tip{font-size:12px}.toast{position:absolute;z-index:8;top:12%;left:50%;transform:translateX(-50%);font-size:28px;font-weight:1000;color:#ffe443;text-shadow:0 3px #8c217d;pointer-events:none;animation:toast .65s forwards}@keyframes toast{to{transform:translate(-50%,-45px) scale(1.25);opacity:0}}.shake{animation:shake .2s}@keyframes shake{50%{transform:translateX(5px)}}.stars{font-size:30px}.progress{height:7px;background:#ffffff22;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#42e9ff,#ffd43b)}</style></head><body><div class="app"><header class="top"><div class="brand">CATCADE</div><div class="levelname" id="levelName">CARNIVAL ARCADE</div><div class="stats"><span>⭐ <b id="score">0</b></span><span>🔥 <b id="combo">0</b>x</span><span>❤️ <b id="lives">3</b></span><span>⏱️ <b id="time">--</b></span></div></header><main class="stage" id="stage"><div class="board" id="board"></div><div class="overlay" id="overlay"><div class="card" id="card"></div></div></main><div class="banner">ADVERTISEMENT · BANNER RESERVED</div></div><script>
const LEVELS=[{"name":"Meadow Pop","desc":"Classic warm-up","theme":"meadow","mode":"normal","time":18,"speed":900},{"name":"Daisy Dash","desc":"Faster pops","theme":"meadow","mode":"normal","time":20,"speed":760},{"name":"Sleepy Hollow","desc":"Don't tap sleepy cats","theme":"night","mode":"avoid","time":22,"speed":800},{"name":"Golden Paws","desc":"Gold cats score triple","theme":"sunset","mode":"gold","time":22,"speed":720},{"name":"Double Trouble","desc":"Two cats at once","theme":"circus","mode":"double","time":24,"speed":760},{"name":"Moonlight Mischief","desc":"Quick night round","theme":"night","mode":"avoid","time":24,"speed":650},{"name":"Candy Cats","desc":"Combo challenge","theme":"candy","mode":"normal","time":25,"speed":620},{"name":"Pirate Pounce","desc":"Treasure cats","theme":"pirate","mode":"gold","time":25,"speed":600},{"name":"Spooky Paws","desc":"Avoid the ghosts","theme":"spooky","mode":"avoid","time":26,"speed":590},{"name":"Snowball Pop","desc":"Icy speed","theme":"snow","mode":"normal","time":26,"speed":560},{"name":"Neon Kitty","desc":"Arcade rush","theme":"neon","mode":"double","time":27,"speed":590},{"name":"Royal Rumble","desc":"Crowns score triple","theme":"royal","mode":"gold","time":27,"speed":540},{"name":"Jungle Jumps","desc":"Wild double pops","theme":"jungle","mode":"double","time":28,"speed":560},{"name":"Space Cats","desc":"Zero-gravity speed","theme":"space","mode":"normal","time":28,"speed":500},{"name":"Rainbow Rush","desc":"Keep the streak","theme":"rainbow","mode":"normal","time":29,"speed":470},{"name":"Midnight Mayhem","desc":"Sleepy decoys","theme":"night","mode":"avoid","time":29,"speed":480},{"name":"Carnival Chaos","desc":"Fast double targets","theme":"circus","mode":"double","time":30,"speed":500},{"name":"Golden Frenzy","desc":"Jackpot round","theme":"gold","mode":"gold","time":30,"speed":440},{"name":"Catcade Blitz","desc":"Everything faster","theme":"neon","mode":"double","time":30,"speed":420},{"name":"Grand Finale","desc":"Master the Catcade","theme":"final","mode":"mixed","time":35,"speed":390}];
const FURS=['#f0ad68','#c7c4c5','#ef8b65','#ad91d8','#f6e7cf','#7c6c69','#e4a0b5'];let level=+(localStorage.catcadeLevel||0),unlocked=Math.max(0,+(localStorage.catcadeUnlocked||0)),score=0,combo=0,bestCombo=0,lives=3,time=0,running=false,timers=[],active=new Set(),types={};const $=s=>document.querySelector(s),board=$('#board'),stage=$('#stage'),overlay=$('#overlay'),card=$('#card'),scoreEl=$('#score'),comboEl=$('#combo'),livesEl=$('#lives'),timeEl=$('#time');function catHTML(i){return `<div class="cat" data-i="${i}" style="--fur:${FURS[i%FURS.length]}"><i class="ear l"></i><i class="ear r"></i><i class="body"></i><i class="face"><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><i class="mouth"></i></i><i class="belly"></i><b class="badge"></b></div>`}for(let i=0;i<9;i++){let h=document.createElement('div');h.className='hole';h.innerHTML=catHTML(i);h.addEventListener('pointerdown',e=>hit(i,e));board.append(h)}const cats=[...document.querySelectorAll('.cat')];function menu(){running=false;clearAll();let buttons=LEVELS.map((x,i)=>`<button class="lv ${i<=unlocked?'open':''} ${i===level?'current':''}" ${i>unlocked?'disabled':''} onclick="pick(${i})">${i+1}<small>${i>unlocked?'🔒':x.name.split(' ')[0]}</small></button>`).join('');card.innerHTML=`<h1>CATCADE</h1><h2>20 LEVEL CARNIVAL</h2><p>Meet the softest troublemakers in the arcade.</p><div class="levels">${buttons}</div><button class="btn" onclick="start()">PLAY LEVEL ${level+1}</button><p class="tip">${LEVELS[level].name} · ${LEVELS[level].desc}</p>`;overlay.classList.remove('hidden')}function pick(i){if(i<=unlocked){level=i;localStorage.catcadeLevel=i;menu()}}function clearAll(){timers.forEach(clearTimeout);timers=[];active.clear();cats.forEach(c=>c.className='cat')}function later(fn,ms){let t=setTimeout(fn,ms);timers.push(t);return t}function start(){clearAll();let L=LEVELS[level];score=0;combo=0;bestCombo=0;lives=3;time=L.time;running=true;scoreEl.textContent=0;comboEl.textContent=0;livesEl.textContent=3;timeEl.textContent=time;$('#levelName').textContent=`LEVEL ${level+1} · ${L.name.toUpperCase()}`;stage.dataset.theme=L.theme;overlay.classList.add('hidden');spawn();let clock=setInterval(()=>{if(!running)return clearInterval(clock);time--;timeEl.textContent=time;if(time<=0)finish(true)},1000);timers.push(clock)}function spawn(){if(!running)return;let L=LEVELS[level],count=(L.mode==='double'||L.mode==='mixed')?2:1;for(let k=0;k<count;k++){let choices=[0,1,2,3,4,5,6,7,8].filter(x=>!active.has(x));if(!choices.length)break;let i=choices[Math.floor(Math.random()*choices.length)],r=Math.random(),type='normal';if((L.mode==='avoid'||L.mode==='mixed')&&r<.28)type='sleep';else if((L.mode==='gold'||L.mode==='mixed')&&r<.34)type='gold';show(i,type,L.speed)}later(spawn,Math.max(230,L.speed*(count===2?.72:1)))}function show(i,type,speed){let c=cats[i];active.add(i);types[i]=type;c.className='cat '+(type==='sleep'?'sleep ':type==='gold'?'goldcat ':'')+'up';later(()=>{if(active.has(i)){c.classList.remove('up');active.delete(i);if(type!=='sleep')miss()}},speed)}function miss(){combo=0;comboEl.textContent=0}function hit(i,e){if(!running||!active.has(i))return;let type=types[i],c=cats[i];active.delete(i);c.classList.add('hit');c.classList.remove('up');if(type==='sleep'){lives--;combo=0;livesEl.textContent=lives;comboEl.textContent=0;stage.classList.add('shake');later(()=>stage.classList.remove('shake'),220);toast('SHHH! 😴');if(lives<=0)finish(false);return}combo++;bestCombo=Math.max(bestCombo,combo);let pts=(10+Math.min(combo,15)*2)*(type==='gold'?3:1);score+=pts;scoreEl.textContent=score;comboEl.textContent=combo;toast(type==='gold'?`JACKPOT +${pts}`:`+${pts}`)}function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;stage.append(x);later(()=>x.remove(),700);if(navigator.vibrate)navigator.vibrate(18)}function finish(completed){if(!running)return;running=false;clearAll();let stars=score>520?3:score>280?2:1;if(completed&&level===unlocked&&unlocked<19){unlocked++;localStorage.catcadeUnlocked=unlocked}localStorage.catcadeBest=Math.max(+(localStorage.catcadeBest||0),score);card.innerHTML=`<h1>${completed?'LEVEL CLEAR!':'OUT OF LIVES'}</h1><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><h2>${score} POINTS</h2><p>Best combo ×${bestCombo} · Level ${level+1} of 20</p><div class="progress"><i style="width:${Math.min(100,score/6)}%"></i></div>${completed&&level<19?`<button class="btn" onclick="next()">NEXT LEVEL</button>`:`<button class="btn" onclick="start()">PLAY AGAIN</button>`}<p class="tip" onclick="menu()">← Level Select</p>`;overlay.classList.remove('hidden')}function next(){level=Math.min(19,level+1);localStorage.catcadeLevel=level;start()}menu();</script></body></html>
