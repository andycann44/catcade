<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Catcade Prototype</title><style>*{box-sizing:border-box;touch-action:manipulation}body{margin:0;font-family:system-ui;background:linear-gradient(#2c1264,#0d1237);color:white;overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column}.top{text-align:center;padding:max(12px,env(safe-area-inset-top)) 12px 6px}.logo{font-size:34px;font-weight:1000;color:#ffd632;text-shadow:0 3px #a22cc7}.stats{display:flex;justify-content:space-around;font-weight:800}.game{flex:1;position:relative;padding:10px;min-height:0}.board{height:100%;max-width:520px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:10px}.hole{position:relative;overflow:hidden;border-radius:45% 45% 22% 22%;background:radial-gradient(ellipse at center,#090913 0 38%,#5c331d 40% 48%,#2d761f 50%);box-shadow:inset 0 -8px 14px #0008}.cat{position:absolute;left:12%;right:12%;bottom:-105%;height:92%;border-radius:50% 50% 40% 40%;background:#f1b36e;transition:bottom .16s cubic-bezier(.2,1.4,.4,1);box-shadow:inset -8px -10px #b56e4a55}.cat:before{content:'🐱';font-size:min(15vw,70px);position:absolute;inset:8% 0 0;text-align:center}.cat.up{bottom:2%}.cat.hit{transform:scale(.8) rotate(12deg);filter:brightness(1.4)}.banner{height:calc(58px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#f5f5f5;color:#555;display:flex;align-items:center;justify-content:center;font-size:12px;border-top:1px solid #bbb}.overlay{position:absolute;inset:0;background:#10102ae8;display:flex;align-items:center;justify-content:center;z-index:5}.card{text-align:center;padding:24px;max-width:330px}.card h1{font-size:42px;margin:0;color:#ffd632}.card p{line-height:1.4}.play{border:0;border-radius:999px;background:#ffd21f;padding:16px 45px;font-size:22px;font-weight:1000;color:#5b2582;box-shadow:0 6px #e28b12}.hidden{display:none}.pop{position:absolute;font-weight:1000;color:#ffe23c;font-size:25px;pointer-events:none;animation:fly .6s forwards}@keyframes fly{to{transform:translateY(-55px) scale(1.3);opacity:0}}</style></head><body><div class="app"><div class="top"><div class="logo">CATCADE</div><div class="stats"><span>⭐ <b id="score">0</b></span><span>🔥 <b id="combo">0</b>x</span><span>❤️ <b id="lives">9</b></span><span>⏱️ <b id="time">30</b></span></div></div><div class="game"><div class="board" id="board"></div><div class="overlay" id="overlay"><div class="card"><h1>CATCADE</h1><h2>POP CATS</h2><p>Tap the plush cats as they pop up. Build combos, protect your nine lives and beat your high score!</p><button class="play" id="play">PLAY!</button></div></div></div><div class="banner">ADVERTISEMENT · permanent banner area</div></div><script>const board=document.querySelector('#board'),scoreEl=document.querySelector('#score'),comboEl=document.querySelector('#combo'),livesEl=document.querySelector('#lives'),timeEl=document.querySelector('#time'),overlay=document.querySelector('#overlay');let score=0,combo=0,lives=9,time=30,running=false,current=-1,tick,popTimer;for(let i=0;i<9;i++){let h=document.createElement('div');h.className='hole';h.innerHTML='<div class="cat"></div>';h.onclick=e=>hit(i,e);board.append(h)}const cats=[...document.querySelectorAll('.cat')];function hit(i,e){if(!running||i!==current||!cats[i].classList.contains('up'))return;cats[i].classList.add('hit');cats[i].classList.remove('up');combo++;score+=10+Math.min(combo,10)*2;scoreEl.textContent=score;comboEl.textContent=combo;let p=document.createElement('div');p.className='pop';p.textContent='+'+(10+Math.min(combo,10)*2);p.style.left=e.clientX+'px';p.style.top=e.clientY+'px';document.body.append(p);setTimeout(()=>p.remove(),650);current=-1;setTimeout(pop,90)}function pop(){if(!running)return;if(current>=0&&cats[current].classList.contains('up')){cats[current].classList.remove('up');combo=0;comboEl.textContent=0;lives--;livesEl.textContent=lives;if(lives<=0)return end()}cats.forEach(c=>{c.className='cat'});let n;do n=Math.floor(Math.random()*9);while(n===current);current=n;cats[n].classList.add('up');let delay=Math.max(430,950-(30-time)*14);clearTimeout(popTimer);popTimer=setTimeout(pop,delay)}function start(){score=0;combo=0;lives=9;time=30;running=true;[scoreEl,comboEl].forEach(x=>x.textContent=0);livesEl.textContent=9;timeEl.textContent=30;overlay.classList.add('hidden');pop();tick=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)end()},1000)}function end(){if(!running)return;running=false;clearInterval(tick);clearTimeout(popTimer);cats.forEach(c=>c.className='cat');overlay.classList.remove('hidden');overlay.querySelector('.card').innerHTML='<h1>'+score+'</h1><h2>FINAL SCORE</h2><p>Best combo: keep those paws moving! 🐾</p><button class="play" onclick="location.reload()">PLAY AGAIN</button>'}document.querySelector('#play').onclick=start;</script></body></html>
